name: tasky
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.3
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.1
  percent_indicator: ^4.2.5
  image_picker: ^1.2.1
  flutter_slidable: ^4.0.3
  equatable: ^2.0.8
  avatar_glow: ^3.0.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.7
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  home_widget: ^0.9.0
  device_preview: ^1.3.1
  flutter_screenutil: ^5.9.3
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  uuid: ^4.5.3
  get_it: ^9.2.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/favicon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#181818"
  image: assets/images/native_splash.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/icons/home.svg
    - assets/icons/todo.svg
    - assets/icons/completed.svg
    - assets/icons/profile.svg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

flutter_intl:
  enabled: true

flutter_assets:
  assets_path: assets
  output_path: lib/core/manager/
  filename: app_assets.dart
  field_prefix:
  classname: AppAssets
  ignore_comments: true
